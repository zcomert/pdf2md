    latex: "\\mathrm{I}_{(-M)} = \\max(m : \\#\\{i \\in \\mathrm{I} : i \\geq m\\} = M)"
    description: null
  - number: "5"
    page: 4
    latex: "\\mathrm{I}^{(M)} = \\{i \\in \\mathrm{I} : i \\leq \\mathrm{I}_{(-M)}\\}"
    description: null
